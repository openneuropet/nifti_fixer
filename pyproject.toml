[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "niftifixer"
version = "0.0.1"
description = "Fixes Nifti's"
authors = [
    {name = "Anthony Galassi", email = "28850131+bendhouseart@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "nibabel>=5.2.1",
    "numpy>=1.21.0"
]

[project.optional-dependencies]
dev = [
    "ipython>=8.27.0"
]

[project.scripts]
niftifixer = "niftifixer:cli"

